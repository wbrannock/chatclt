name: style-check

on:
  workflow_dispatch:

jobs:
  pre-commit:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repo
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: run pre-commit
        uses: pre-commit/action@v3.0.0
